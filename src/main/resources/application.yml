spring:
  datasource:
    url: jdbc:h2:file:${DB_PATH:./data/autotrading};MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  application:
    name: futu-stock-monitor
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.ssl.enable: ${MAIL_SSL:true}
      mail.smtp.connectiontimeout: 15000
      mail.smtp.timeout: 15000
      mail.smtp.writetimeout: 15000
      mail.smtp.socketFactory.port: ${MAIL_PORT:465}
      mail.smtp.socketFactory.class: javax.net.ssl.SSLSocketFactory

ai:
  analysis:
    api:
      url: ${AI_ANALYSIS_API_URL:http://host.docker.internal:9000/api/analyze}
  # Right-trend analysis LLM providers (OpenAI-compatible Chat Completions).
  # Each provider carries its own label/api-key/api-url/model/json-mode/timeout.
  # Only providers with a non-blank api-key are surfaced (see AiProviderProperties).
  default-provider: ${AI_DEFAULT_PROVIDER:deepseek}
  providers:
    deepseek:
      label: ${AI_DEEPSEEK_LABEL:DeepSeek}
      # AI_DEEPSEEK_* takes priority; falls back to legacy DEEPSEEK_* for zero-change upgrades.
      api-key: ${AI_DEEPSEEK_API_KEY:${DEEPSEEK_API_KEY:}}
      api-url: ${AI_DEEPSEEK_API_URL:${DEEPSEEK_API_URL:https://api.deepseek.com/v1/chat/completions}}
      model: ${AI_DEEPSEEK_MODEL:${DEEPSEEK_MODEL:deepseek-chat}}
      json-mode: ${AI_DEEPSEEK_JSON_MODE:true}
      timeout-ms: ${AI_DEEPSEEK_TIMEOUT_MS:${DEEPSEEK_TIMEOUT_MS:60000}}
      rate-limit-ms: ${AI_DEEPSEEK_RATE_LIMIT_MS:${DEEPSEEK_RATE_LIMIT_MS:500}}
      temperature: ${AI_DEEPSEEK_TEMPERATURE:0.1}
    kimi:
      label: ${AI_KIMI_LABEL:Kimi}
      api-key: ${AI_KIMI_API_KEY:}
      api-url: ${AI_KIMI_API_URL:https://api.kimi.com/coding/v1/chat/completions}
      model: ${AI_KIMI_MODEL:kimi-k3}
      json-mode: ${AI_KIMI_JSON_MODE:true}
      timeout-ms: ${AI_KIMI_TIMEOUT_MS:180000}
      user-agent: ${AI_KIMI_USER_AGENT:claude-code/0.1.0}
      # temperature deliberately unset: kimi-k3 rejects any value other than 1,
      # so we omit the field and let the server apply its default.

right-trend:
  group-us: ${RIGHT_TREND_GROUP_US:US}
  group-hk: ${RIGHT_TREND_GROUP_HK:HK}
  group-cn: ${RIGHT_TREND_GROUP_CN:CN}
  kline-lookback: 60
  # Provider for the daily scheduled jobs (09:00 US, 17:00 HK+CN).
  # Decoupled from ai.default-provider so the frontend default can change freely.
  scheduled-provider: ${RIGHT_TREND_SCHEDULED_PROVIDER:deepseek}

# In-memory K-line cache TTL (minutes). 0 disables expiry (legacy behavior).
# Right-trend analysis always refetches via invalidate(); this TTL is a backstop
# for other consumers that read cached closes.
kline:
  cache-ttl-minutes: ${KLINE_CACHE_TTL_MINUTES:360}

futu:
  opend:
    ip: ${OPEND_IP:127.0.0.1}
    port: ${OPEND_PORT:11111}
    encrypt: ${OPEND_ENCRYPT:false}
    rsa-key: ${OPEND_RSA_KEY:}
  filter:
    group-name: ${FUTU_GROUP_NAME:}
  monitor:
    ma-periods: [5, 13, 30, 55]
    price-change-threshold: ${PRICE_CHANGE_THRESHOLD:2.0}
    alert-cooldown-minutes: ${ALERT_COOLDOWN_MINUTES:15}
    ma-noise-minutes: ${MA_NOISE_MINUTES:}
    fluctuation-noise-minutes: ${FLUCTUATION_NOISE_MINUTES:}
    signal-noise-minutes: ${SIGNAL_NOISE_MINUTES:}
    breakdown-noise-minutes: ${BREAKDOWN_NOISE_MINUTES:}
    kline-refresh-interval: ${KLINE_REFRESH_INTERVAL:60000}
    market-state-poll-interval: ${MARKET_STATE_POLL_INTERVAL:30000}
    snapshot-poll-interval: ${SNAPSHOT_POLL_INTERVAL:10000}
  reconnect:
    initial-delay-ms: ${RECONNECT_INITIAL_DELAY_MS:5000}
    max-delay-ms: ${RECONNECT_MAX_DELAY_MS:60000}
    multiplier: ${RECONNECT_MULTIPLIER:2.0}
  fluctuation:
    logic: ${FLUCTUATION_LOGIC:OR}
    eval-interval-ms: ${FLUCTUATION_EVAL_INTERVAL:30000}
    rules:
      - window-minutes: 3
        threshold-percent: 3.0
      - window-minutes: 5
        threshold-percent: 5.0
notification:
  mail:
    from: ${MAIL_FROM:}
    to: ${MAIL_TO:}
    enabled: ${MAIL_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
  # Mail is an async notification channel; an unreachable SMTP host must not
  # drag the aggregate health DOWN (the auto-configured MailHealthIndicator does
  # a real SMTP probe that times out under Docker and flips health to 503).
  health:
    mail:
      enabled: false

logging:
  level:
    com.autotrading: INFO
    com.futu.openapi: WARN
