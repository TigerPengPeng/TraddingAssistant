<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>右侧趋势分析 - Futu Stock Monitor</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --green: #3fb950;
    --red: #f85149;
    --blue: #58a6ff;
    --yellow: #d29922;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    padding: 20px;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .header h1 { font-size: 18px; font-weight: 600; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--blue); }
  .btn:disabled { opacity: 0.5; cursor: wait; }
  .btn .spinner {
    width: 12px; height: 12px;
    border: 2px solid var(--text-dim);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .summary-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .summary-box .meta {
    font-size: 12px;
    color: var(--text-dim);
  }
  .summary-box .count {
    font-size: 20px;
    font-weight: 700;
  }
  .summary-box .count.green { color: var(--green); }
  .summary-box .count.red { color: var(--red); }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
  }
  .pill.green { background: rgba(63,185,80,0.15); color: var(--green); }
  .pill.red { background: rgba(248,81,73,0.15); color: var(--red); }
  .pill.yellow { background: rgba(210,153,34,0.15); color: var(--yellow); }
  .pill.blue { background: rgba(88,166,255,0.15); color: var(--blue); }
  .pill.dim { background: rgba(139,148,158,0.15); color: var(--text-dim); }
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .section-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .section-header .sub { color: var(--text-dim); font-size: 12px; font-weight: 400; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    text-align: left;
    padding: 8px 12px;
    color: var(--text-dim);
    font-weight: 500;
    font-size: 11px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  td {
    padding: 8px 12px;
    border-bottom: 1px solid rgba(48,54,61,0.5);
    vertical-align: top;
  }
  td.num, th.num { text-align: center; }
  tr:last-child td { border-bottom: none; }
  .empty-state {
    padding: 40px 16px;
    text-align: center;
    color: var(--text-dim);
  }
  .reason-cell {
    max-width: 300px;
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.4;
  }
  .signals-cell { max-width: 200px; }
  .signals-cell .signal {
    display: inline-block;
    margin: 1px 2px;
  }
  .stock-name { font-weight: 600; }
  .stock-code { color: var(--text-dim); font-size: 11px; margin-left: 4px; }
  .fail-text { color: var(--red); font-style: italic; }
</style>
</head>
<body>

<div class="header">
  <h1>右侧趋势分析</h1>
  <div style="display:flex;gap:12px;align-items:center">
  <a href="/" class="btn">返回主页</a>
    <select id="model-select" title="选择本次分析所用的大模型" style="background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:13px">
      <option value="">模型加载中…</option>
    </select>
    <select id="group-select" style="background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:13px">
     <option value="us">美股</option>
     <option value="hk">港股</option>
     <option value="cn" selected>沪深</option>
     <option value="all">全部</option>
      <option value="watch">关注</option>
    </select>
    <label style="font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:4px">
      <input type="checkbox" id="send-email"> 发邮件
    </label>
    <button class="btn" id="analyze-btn" onclick="analyze()">立即分析</button>
    <select id="history-select" onchange="loadHistoryReport()" style="background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:13px">
      <option value="">历史报告</option>
    </select>
  </div>
</div>

<div id="report-container">
  <div class="empty-state">加载中...</div>
</div>

<script>
function fmtTime(ts) {
  var d = new Date(ts);
  return d.toLocaleString('zh-CN', { hour12: false });
}

function trendPill(r) {
  if (!r.success) return '<span class="pill dim">分析失败</span>';
  if (r.isInRightTrend) return '<span class="pill green">&#10003; 右侧</span>';
  return '<span class="pill red">&#10007; 未确认</span>';
}

function confidencePill(c) {
  if (!c) return '<span class="pill dim">--</span>';
  var cls = c === 'high' ? 'green' : c === 'medium' ? 'yellow' : 'dim';
  return '<span class="pill ' + cls + '">' + c + '</span>';
}

async function loadLatest() {
  try {
    const resp = await fetch('/api/right-trend/latest');
    const d = await resp.json();
    if (d.status === 'ok') {
      renderReport(d.report);
    } else {
      document.getElementById('report-container').innerHTML =
        '<div class="empty-state">尚未生成报告，点击「立即分析」</div>';
    }
  } catch(e) {
    document.getElementById('report-container').innerHTML =
      '<div class="empty-state">加载失败: ' + e.message + '</div>';
  }
}

async function loadHistoryList() {
  try {
    const resp = await fetch('/api/right-trend/history');
    const d = await resp.json();
    const select = document.getElementById('history-select');
    (d.reports || []).forEach(function(r) {
      var opt = document.createElement('option');
      opt.value = r.date;
      opt.textContent = r.date + ' (' + r.groups.join('+') + ' ' + r.inRightTrend + '/' + r.totalStocks + ')';
      select.appendChild(opt);
    });
  } catch(e) {}
}

async function loadHistoryReport() {
  var date = document.getElementById('history-select').value;
  if (!date) { loadLatest(); return; }
  try {
    const resp = await fetch('/api/right-trend/' + date);
    const d = await resp.json();
    if (d.status === 'ok') renderReport(d.report);
  } catch(e) {}
}

async function analyze() {
  var btn = document.getElementById('analyze-btn');
  var groups = document.getElementById('group-select').value;
  var sendEmail = document.getElementById('send-email').checked;
  var provider = document.getElementById('model-select').value;
  var providerLabel = (document.getElementById('model-select').selectedOptions[0] || {}).text || provider;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 分析中';
  document.getElementById('report-container').innerHTML =
    '<div class="empty-state">正在调用「' + providerLabel + '」逐只分析，请稍候（约 1-3 分钟）...</div>';
  try {
    const resp = await fetch('/api/right-trend/analyze?groups=' + encodeURIComponent(groups)
        + '&sendEmail=' + sendEmail + '&provider=' + encodeURIComponent(provider), { method: 'POST' });
    const d = await resp.json();
    if (d.status === 'ok') renderReport(d.report);
    else if (d.status === 'error') {
      document.getElementById('report-container').innerHTML =
        '<div class="empty-state">' + (d.message || '分析失败') + '</div>';
    }
    btn.textContent = 'Done';
  } catch(e) {
    btn.textContent = 'Error';
    document.getElementById('report-container').innerHTML =
      '<div class="empty-state">分析失败: ' + e.message + '</div>';
  }
  setTimeout(function() { btn.disabled = false; btn.textContent = '立即分析'; }, 2000);
}

function renderReport(report) {
  var stocks = report.stocks || [];
  var inTrend = stocks.filter(function(s) { return s.isInRightTrend; });
  var notTrend = stocks.filter(function(s) { return !s.isInRightTrend && s.success; });
  var failed = stocks.filter(function(s) { return !s.success; });

  var html = '<div class="summary-box">' +
    '<div>' +
      '<div class="meta">' + (report.providerLabel ? report.providerLabel + ' · ' : '') + (report.groupNames || []).join(' + ') + ' &middot; ' + report.date + '</div>' +
      '<div style="margin-top:4px">' +
        '<span class="count green">' + inTrend.length + '</span> <span style="color:var(--text-dim)">已进入右侧</span>' +
        ' &nbsp;/&nbsp; <span class="count">' + stocks.length + '</span> <span style="color:var(--text-dim)">只股票</span>' +
      '</div>' +
    '</div>' +
    '<div class="meta">生成于 ' + fmtTime(report.generatedAt) + '</div>' +
  '</div>';

  function stockRow(s) {
    var signals = (s.keySignals || []).map(function(sig) {
      return '<span class="signal pill blue">' + sig + '</span>';
    }).join('');
    return '<tr>' +
      '<td><span class="stock-name">' + (s.stockName || s.stockKey) + '</span>' +
        '<span class="stock-code">' + s.stockKey + '</span></td>' +
      '<td class="num"><span class="pill dim">' + (s.groupName || '') + '</span></td>' +
      '<td class="num">' + trendPill(s) + '</td>' +
      '<td class="num">' + confidencePill(s.confidence) + '</td>' +
      '<td class="signals-cell">' + signals + '</td>' +
      '<td class="reason-cell">' + (s.success ? (s.reason || '') : '<span class="fail-text">' + (s.reason || '分析失败') + '</span>') + '</td>' +
    '</tr>';
  }

  if (inTrend.length > 0) {
    html += '<div class="section"><div class="section-header">' +
      '<span>&#10003; 已进入右侧趋势</span><span class="sub">' + inTrend.length + ' 只</span></div>' +
      '<table><thead><tr>' +
      '<th>股票</th><th class="num">分组</th><th class="num">右侧趋势</th><th class="num">置信度</th><th>关键信号</th><th>分析原因</th>' +
      '</tr></thead><tbody>' + inTrend.map(stockRow).join('') + '</tbody></table></div>';
  }

  if (notTrend.length > 0) {
    html += '<div class="section"><div class="section-header">' +
      '<span style="color:var(--text-dim)">&#10007; 尚未确认右侧趋势</span><span class="sub">' + notTrend.length + ' 只</span></div>' +
      '<table><thead><tr>' +
      '<th>股票</th><th class="num">分组</th><th class="num">右侧趋势</th><th class="num">置信度</th><th>关键信号</th><th>分析原因</th>' +
      '</tr></thead><tbody>' + notTrend.map(stockRow).join('') + '</tbody></table></div>';
  }

  if (failed.length > 0) {
    html += '<div class="section"><div class="section-header">' +
      '<span style="color:var(--red)">分析失败</span><span class="sub">' + failed.length + ' 只</span></div>' +
      '<table><thead><tr>' +
      '<th>股票</th><th class="num">分组</th><th class="num">右侧趋势</th><th class="num">置信度</th><th>关键信号</th><th>分析原因</th>' +
      '</tr></thead><tbody>' + failed.map(stockRow).join('') + '</tbody></table></div>';
  }

  if (stocks.length === 0) {
    html = '<div class="empty-state">报告中无股票数据</div>';
  }

  document.getElementById('report-container').innerHTML = html;
}

async function loadModels() {
  try {
    const resp = await fetch('/api/right-trend/models');
    const d = await resp.json();
    var sel = document.getElementById('model-select');
    sel.innerHTML = '';
    var list = d.models || [];
    if (list.length === 0) {
      var opt = document.createElement('option');
      opt.value = '';
      opt.textContent = '未配置模型';
      sel.appendChild(opt);
      return;
    }
    list.forEach(function(m) {
      var opt = document.createElement('option');
      opt.value = m.id;
      opt.textContent = m.label || m.id;
      sel.appendChild(opt);
    });
    sel.value = d.default || list[0].id;
  } catch(e) {
    // keep "模型加载中…" on failure
  }
}

loadLatest();
loadHistoryList();
loadModels();
</script>

</body>
</html>
