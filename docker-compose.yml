services:
  futu-stock-monitor:
    build: .
    container_name: futu-stock-monitor
    restart: unless-stopped
    environment:
      # Futu OpenD connection
      # IMPORTANT: OpenD must listen on 0.0.0.0 (not 127.0.0.1)
      # for the container to reach it via host.docker.internal
      OPEND_IP: ${OPEND_IP:-host.docker.internal}
      OPEND_PORT: ${OPEND_PORT:-11111}
      OPEND_ENCRYPT: ${OPEND_ENCRYPT:-false}
      FUTU_GROUP_NAME: ${FUTU_GROUP_NAME:-}
      # Monitoring
      PRICE_CHANGE_THRESHOLD: ${PRICE_CHANGE_THRESHOLD:-2.0}
      ALERT_COOLDOWN_MINUTES: ${ALERT_COOLDOWN_MINUTES:-15}
      # Email
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SSL: ${MAIL_SSL:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_TO: ${MAIL_TO:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      # DeepSeek AI
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_URL: ${DEEPSEEK_API_URL:-https://api.deepseek.com/v1/chat/completions}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      # LLM providers (right-trend analysis) — AI_* takes priority over legacy DEEPSEEK_*
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-deepseek}
      AI_DEEPSEEK_LABEL: ${AI_DEEPSEEK_LABEL:-DeepSeek}
      AI_DEEPSEEK_API_KEY: ${AI_DEEPSEEK_API_KEY:-}
      AI_DEEPSEEK_API_URL: ${AI_DEEPSEEK_API_URL:-https://api.deepseek.com/v1/chat/completions}
      AI_DEEPSEEK_MODEL: ${AI_DEEPSEEK_MODEL:-deepseek-chat}
      AI_GLM_LABEL: ${AI_GLM_LABEL:-智谱GLM}
      AI_GLM_API_KEY: ${AI_GLM_API_KEY:-}
      AI_GLM_API_URL: ${AI_GLM_API_URL:-https://open.bigmodel.cn/api/paas/v4/chat/completions}
      AI_GLM_MODEL: ${AI_GLM_MODEL:-glm-4.6}
      AI_KIMI_LABEL: ${AI_KIMI_LABEL:-Kimi}
      AI_KIMI_API_KEY: ${AI_KIMI_API_KEY:-}
      AI_KIMI_API_URL: ${AI_KIMI_API_URL:-https://api.kimi.com/coding/v1/chat/completions}
      AI_KIMI_MODEL: ${AI_KIMI_MODEL:-kimi-k3}
      AI_KIMI_TIMEOUT_MS: ${AI_KIMI_TIMEOUT_MS:-180000}
      AI_KIMI_USER_AGENT: ${AI_KIMI_USER_AGENT:-claude-code/0.1.0}
      # Reconnect
      RECONNECT_INITIAL_DELAY_MS: ${RECONNECT_INITIAL_DELAY_MS:-5000}
      RECONNECT_MAX_DELAY_MS: ${RECONNECT_MAX_DELAY_MS:-60000}
      # Database
      DB_PATH: /app/data/autotrading
      # Provider for the daily scheduled right-trend jobs (default deepseek).
      RIGHT_TREND_SCHEDULED_PROVIDER: ${RIGHT_TREND_SCHEDULED_PROVIDER:-deepseek}
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
